<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Study Timer & Schedule</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0F172A, #1E1B4B);
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { margin: 10px 0; font-size: 28px; }
        p { color: #94A3B8; font-size: 15px; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #6366F1;
            color: white;
            padding: 8px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .footer { margin-top: 25px; font-size: 12px; color: #64748B; }
        .footer a { color: #818CF8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 50px;">📚</div>
        <h1>StudyMate</h1>
        <p>Your smart companion for study timers, schedules, habit streaks, and exam tracking.</p>
        <a href="https://play.google.com/store/apps/details?id=com.prasannadulal.studyschedule" class="badge">View on Google Play</a>
        <div class="footer">
            <p><a href="/app-ads.txt">app-ads.txt</a> · Official Developer Site</p>
        </div>
    </div>
</body>
</html>
